services:
  db:
    image: pgvector/pgvector:pg16
    container_name: kestrel-db
    environment:
      POSTGRES_USER: lenny
      POSTGRES_PASSWORD: lenny_dev_only
      POSTGRES_DB: lenny_growth
    ports:
      - "${POSTGRES_PORT:-5433}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U lenny -d lenny_growth"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  agent-gateway:
    build:
      context: ./agent-gateway
      dockerfile: Dockerfile
    container_name: kestrel-agent-gateway
    environment:
      PORT: 8010
      NODE_ENV: development
      OLLAMA_BASE_URL: http://host.docker.internal:11434
      INTERNAL_SERVICE_TOKEN: ${INTERNAL_SERVICE_TOKEN:-replace-with-a-long-random-local-token}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "8010:8010"
    restart: unless-stopped

  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: kestrel-api
    environment:
      APP_ENV: development
      DATABASE_URL: postgresql+asyncpg://lenny:lenny_dev_only@db:5432/lenny_growth
      AGENT_GATEWAY_URL: http://agent-gateway:8010
      OLLAMA_BASE_URL: http://host.docker.internal:11434
      INTERNAL_SERVICE_TOKEN: ${INTERNAL_SERVICE_TOKEN:-replace-with-a-long-random-local-token}
      DEFAULT_PROVIDER: local
      DEFAULT_CLOUD_PROVIDER: gemini
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./runtime-skills:/app/runtime-skills:ro
      - ./alembic.ini:/app/alembic.ini:ro
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
      agent-gateway:
        condition: service_started
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: kestrel-frontend
    ports:
      - "5173:80"
    depends_on:
      - api
    restart: unless-stopped

volumes:
  postgres_data:

